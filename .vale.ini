StylesPath = .github/styles
MinAlertLevel = suggestion

Vocab = Blog

Packages = Google, Readability

[*.md]
BasedOnStyles = Vale, Google, Readability, Blog

# Disable built-in terms check to allow flexible capitalization of accepted words
Vale.Terms = NO

# Disable strict developer docs rules for personal blog writing style
Google.FirstPerson = NO
Google.We = NO
Google.Will = NO
Google.Exclamation = NO
Google.Slang = NO
Google.Quotes = NO
Google.Spacing = NO
Google.Units = NO
Google.OptionalPlurals = NO
Google.Ordinal = NO
Google.Latin = NO
Google.GenderBias = NO
Google.Passive = NO
Google.Parens = NO
Google.Acronyms = NO
Google.Contractions = NO
Google.Semicolons = NO
Google.WordList = NO
Google.Headings = NO
Google.Ellipses = NO
Google.OxfordComma = NO

# Disable standard Readability package rules to use our customized Blog thresholds instead
Readability.FleschReadingEase = NO
Readability.SMOG = NO
Readability.LIX = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.ColemanLiau = NO
Readability.AutomatedReadability = NO

